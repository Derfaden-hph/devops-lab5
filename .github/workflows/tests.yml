from fastapi.testclient import TestClient
from src.main import app

client = TestClient(app)

users = [
    {'id': 1, 'name': 'Ivan Ivanov', 'email': 'i.i.ivanov@mail.com'},
    {'id': 2, 'name': 'Petr Petrov', 'email': 'p.p.petrov@mail.com'}
]

def test_get_existed_user():
    response = client.get("/api/v1/user", params={'email': users[0]['email']})
    assert response.status_code == 200
    assert response.json() == users[0]

def test_get_unexisted_user():
    response = client.get("/api/v1/user", params={'email': 'nonexistent@example.com'})
    assert response.status_code == 404
    assert response.json() == {"detail": "User not found"}

def test_create_user_with_valid_email():
    new_email = "unique_test@example.com"
    new_name = "Unique Test User"
    response = client.post("/api/v1/user", json={"name": new_name, "email": new_email})
    assert response.status_code == 201
    user_id = response.json()
    assert isinstance(user_id, int)
    get_response = client.get("/api/v1/user", params={'email': new_email})
    assert get_response.status_code == 200
    assert get_response.json()["name"] == new_name
    assert get_response.json()["email"] == new_email

def test_create_user_with_invalid_email():
    existing_email = users[0]['email']
    response = client.post("/api/v1/user", json={"name": "Some Name", "email": existing_email})
    assert response.status_code == 409
    assert response.json() == {"detail": "User with this email already exists"}

def test_delete_user():
    temp_email = "todelete@example.com"
    temp_name = "To Delete"
    create_resp = client.post("/api/v1/user", json={"name": temp_name, "email": temp_email})
    assert create_resp.status_code == 201
    delete_resp = client.delete("/api/v1/user", params={'email': temp_email})
    assert delete_resp.status_code == 204
    get_resp = client.get("/api/v1/user", params={'email': temp_email})
    assert get_resp.status_code == 404
